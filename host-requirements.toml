schema = 1

# .envrc runs exobrain outdated, which 2.0.0 carries first.
[tools.exobrain]
version = ">=2.0.0"

# The host configuration owns the version of git.
[tools.git]

# The host configuration owns the version of nix.
[tools.nix]

# The host configuration owns the one version of kache, which .envrc names
# as RUSTC_WRAPPER.
[tools.kache]

# minimum_prek_version in .pre-commit-config.yaml enforces the version of
# prek, so the checker leaves it to prek.
[tools.prek]
version = "*"
