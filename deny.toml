[graph]
targets = []
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Unlicense",
]
exceptions = [
  { name = "spec-driven-docs", allow = ["CC-BY-4.0"] },
]

[bans]
multiple-versions = "deny"
deny = [{ name = "openssl-sys" }]
# tracing-attributes pins syn 2 while clap, serde, and thiserror have moved to
# syn 3. Both are proc-macro-only, so nothing ships twice; drop this skip once
# tracing-attributes releases a syn 3 build.
skip = [{ crate = "syn@2", reason = "tracing-attributes has not moved to syn 3" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
