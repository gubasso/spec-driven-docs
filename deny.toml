[graph]
targets = []
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
exceptions = [
  { name = "spec-driven-docs", allow = ["CC-BY-4.0"] },
]

[bans]
multiple-versions = "warn"
deny = [{ name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
