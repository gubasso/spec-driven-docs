# What this project's gates judge.
#
# Edit this file, then run `sdd hooks --apply`. The managed region of
# .pre-commit-config.yaml is rendered from here, so it stays wholly owned by
# sdd and an upgrade never meets your edit.
#
# This repository is the exception: its managed region carries canon-only
# hooks no installer writes, so the region is maintained by hand and the
# per-gate wiring below is kept equal to it by `sdd verify`.
#
# `sdd gate --explain <path>` answers why a gate judged a path, or did not,
# and names the pattern that decided.
#
# Patterns are globs. `*` does not cross a `/` and `**` descends. A leading
# `!` or `#`, an absolute path, and a `..` component are refused.
#
# Four layers compose, in this order, highest last:
#
#   1. the gate's registry default
#   2. its `gates:` entry below
#   3. a --include or --exclude flag
#   4. the `reserved:` list, which no gate escapes
#
# Every `exclude` layer extends. A `gates:` `include` replaces the registry
# default rather than adding to it, because an include is a whitelist and
# extending one could only widen what the gate judges.

# Paths no delivered gate judges. Another tool owns these.
reserved: []

# Per-gate filters. A gate not named here takes its registry default.
gates:
  # The comparison gates judge the template alone here. This repository
  # authors the convention rather than consuming it, and its own comparison
  # documents are worked examples rather than deliverables held to it.
  comparison-dated-tables:
    include:
      - templates/TEMPLATE-comparison.md
  comparison-escaped-pipes:
    include:
      - templates/TEMPLATE-comparison.md
  comparison-legend:
    include:
      - templates/TEMPLATE-comparison.md
  comparison-one-reference-per-cell:
    include:
      - templates/TEMPLATE-comparison.md
  comparison-verdict-word:
    include:
      - templates/TEMPLATE-comparison.md

  # Every `KI-` token this repository writes outside the documentation root
  # is a fixture or a worked example, never a live citation. The method
  # chapters teach the citation form, and the unit and integration tests
  # build records in temporary directories. This repository keeps no
  # known-issue zone of its own, so it cites no case. A project that adopts
  # one narrows this list to the paths whose tokens are fixtures.
  suppression-names-its-case:
    exclude:
      - method/**
      - src/**
      - tests/**

  # The test fixtures hold records shaped like real ones, and the filename
  # gate judges them so a fixture cannot drift from the shape it stands for.
  ki-filename-shape:
    include:
      - _docs/reference/known-issues/KI-*.md
      - tests/fixtures/KI-*.md
