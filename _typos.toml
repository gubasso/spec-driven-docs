# The generated files keep their generator's form, so typos judges none of them.
# The pre-commit fixer hooks name the generator of each.
[files]
extend-exclude = [
  "CHANGELOG.md",
  "SECURITY.md",
  ".github/workflows/pr-title.yml",
  ".github/workflows/release-plz.yml",
  ".github/workflows/release.yml",
  ".release-kit/manifest.json",
  ".spec-driven-docs/manifest.json",
  "instance/payload-manifest.json",
  ".claude/skills/**",
  ".agents/skills/**",
  "Cargo.lock",
  "flake.lock",
  "tests/fixtures/**",
]

[default.extend-words]
MADR = "MADR"
Diataxis = "Diataxis"
Bugzilla = "Bugzilla"
dprint = "dprint"
lychee = "lychee"
md-toc = "md-toc"
Sclar = "Sclar"
