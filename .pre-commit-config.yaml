default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The node hook runs on the devshell nodejs. Without this line an empty
# pre-commit cache can pick `default`, and nodeenv then fails on a prerelease
# entry of the node index: "invalid literal for int() with base 10: '0-alpha'"
# (2026-11-10).
default_language_version:
  node: system
# The commit stage and the push stage together run every check of ci.yml,
# and the push stage carries only the costly checks, so a hook that names no
# stage runs at commit and in the manual stage rk integrate runs, never again
# at push (release:the-local-hooks-run-every-check-of-ci). A remote manifest
# that declares its own stages wins over this default, so those hooks below
# name theirs.
default_stages: [pre-commit, manual]

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at, with
# the hook runner on PATH, prek or pre-commit, which take the same flags:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# A CI sweep commits nothing, so a job running the hook runner against a trunk
# checkout sets SKIP=no-commit-to-branch,rk-worktree-location in its environment. Append the id of
# every check this project classifies local-only: the value is a list the
# project owns the tail of.
# rk integrate runs this project's pre-integrate suite as
# `prek run --hook-stage manual --all-files`, or as `pre-commit run` with
# the same arguments where prek is not on PATH. Assign to the manual
# stage every check that must pass before work reaches the trunk, and have
# continuous integration invoke the same stages: a check that runs on one
# side of the boundary alone guards one side alone.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      - id: rk-worktree-location
        name: rk worktree location
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-force-push-to-trunk
        name: rk no force push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tracked=$(git rev-parse --verify --quiet "refs/remotes/$PRE_COMMIT_REMOTE_NAME/master"); for base in "$PRE_COMMIT_FROM_REF" "$tracked"; do case "$base" in "") continue;; *[!0]*) ;; *) continue;; esac; git merge-base --is-ancestor "$base" "$PRE_COMMIT_TO_REF" 2>/dev/null && continue; echo "refusing a force push to master, because $base is not an ancestor of the pushed tip; rebase onto the remote trunk instead of rewriting it" >&2; exit 1; done'
      - id: rk-no-merge-commit-to-trunk
        name: rk no merge commit to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tip=${PRE_COMMIT_TO_REF:-$PRE_COMMIT_LOCAL_BRANCH}; [ -n "$tip" ] || exit 0; case "$PRE_COMMIT_FROM_REF" in ""|*[!0]*) range=${PRE_COMMIT_FROM_REF:+$PRE_COMMIT_FROM_REF..}$tip;; *) range=$tip;; esac; merges=$(git rev-list --merges "$range") || { echo "the commits pushed to master cannot be listed, so the push is refused" >&2; exit 1; }; [ -z "$merges" ] && exit 0; echo "refusing a push that adds a merge commit to master, whose history stays linear; rebase instead" >&2; git log --oneline --no-walk $merges >&2; exit 1'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|release-please-config\.json$|cliff\.toml$|\.release-please-manifest\.json$|VERSION$)'
# END release-kit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A generated file keeps the form its generator writes, so no check
      # rewrites it or judges its prose or form (instance/README.md states
      # the rule for every instance). The three fixers have no configuration
      # of their own, so the list lives here: release-plz's CHANGELOG.md,
      # release-kit's rendered SECURITY.md, pr-title.yml, release-plz.yml and
      # manifest, cargo-dist's release.yml, this tool's own instance record,
      # and the cargo and nix lock files. Each other tool excludes them in its
      # own configuration: dprint.json, .markdownlint-cli2.jsonc, _typos.toml,
      # and .editorconfig-checker.json. The reading hooks keep every one.
      - id: trailing-whitespace
        stages: [pre-commit, manual]
        args: [--markdown-linebreak-ext=md]
        exclude: &generated '^(CHANGELOG\.md|SECURITY\.md|\.github/workflows/(pr-title|release-plz|release)\.yml|\.release-kit/manifest\.json|\.spec-driven-docs/manifest\.json|Cargo\.lock|flake\.lock)$'
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
        exclude: *generated
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated
      - id: check-added-large-files
        stages: [pre-commit, manual]
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: destroyed-symlinks
        stages: [pre-commit, manual]
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline]
# Hooks only this repository runs sit outside the managed region at the end
# of this file. That region is the render `just hooks` applies, and a cargo
# test holds it there.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint check
        # dprint exits 14 rather than passing when it receives only paths its
        # own config excludes, which is what a commit touching just the
        # generated CHANGELOG.md hands it.
        entry: dprint check --allow-no-files
        language: system
        types_or: [markdown, json]
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-test
        name: cargo nextest
        entry: cargo nextest run
        language: system
        files: '^(src/|tests/|build\.rs$|Cargo\.(toml|lock)$|_docs/specs/|_docs/\.markdownlint-cli2\.jsonc$|templates/|instance/|method/|skills/|migrations/|LICENSE|\.pre-commit-config\.yaml$)'
        pass_filenames: false
      # The instance-manifest gate parses the record in Rust and never reads
      # the published schema, so this holds the record to the schema.
      # owner: devshell (outside-caller) the cargo tests run check-jsonschema from PATH, so the hook runs the same one.
      - id: instance-manifest-schema
        name: instance manifest matches its schema
        entry: check-jsonschema --schemafile instance/manifest.schema.json .spec-driven-docs/manifest.json
        language: system
        files: '^(instance/manifest\.schema\.json|\.spec-driven-docs/manifest\.json)$'
        pass_filenames: false
      # The costly checks run at push, and in the manual stage rk integrate
      # runs, so a push that passed its hooks passes CI.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        stages: [pre-push, manual]
        always_run: true
        pass_filenames: false
      # owner: devshell (project-environment) the just recipe builds sdd and installs it into a scratch repository.
      - id: scratch-install
        name: install into a scratch repository and verify it
        entry: just build
        language: system
        stages: [pre-push, manual]
        always_run: true
        pass_filenames: false
      # nix flake check builds only the checks output, so the package is
      # built on its own: without it a green run proves nothing about
      # nix/package.nix.
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that pre-commit builds.
      - id: nix-build
        name: nix build of the package
        entry: nix build .#default --no-link
        language: system
        stages: [pre-push, manual]
        always_run: true
        pass_filenames: false
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that pre-commit builds.
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        stages: [pre-push, manual]
        always_run: true
        pass_filenames: false
      # The evaluated half of release:the-binary-builds-for-every-declared-target:
      # nix flake check without --all-systems checks only the system it runs
      # on, so only an evaluation says which systems the flake exposes.
      # owner: devshell (no-hook-language) a script of this repository that evaluates the flake with nix and jq.
      - id: one-system
        name: the flake exposes one system
        entry: ./scripts/check-one-system.sh
        language: system
        stages: [pre-push, manual]
        always_run: true
        pass_filenames: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '\.(sh|bash)$'
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-d, -i, '2', -ci]
        stages: [pre-commit, manual]
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devshell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
  - repo: https://github.com/frnmst/md-toc
    rev: 9.1.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github, -l, '3']
        files: '^_docs/specs/SPEC-.*\.md$'
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos
        stages: [pre-commit, manual]
        args: [--force-exclude]
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # The devshell supplies the lychee binary, so the hook installs none.
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push]
        types: [markdown]
        # CHANGELOG.md is release-plz output, like the dprint and prose-gate
        # exemptions: it links every version to a compare range whose endpoints
        # it assumes are tags, and 0.2.0 was published by hand and never tagged.
        exclude: '^(tests/fixtures/|CHANGELOG\.md$)'
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]
  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store. The hook is published by exobrain-tech.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.0.0
    hooks:
      - id: no-path-flake-reference
# BEGIN spec-driven-docs managed
  - repo: local
    hooks:
      - id: spec-driven-docs-verify
        name: verify spec-driven docs instance
        entry: cargo run -q -- verify
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-cites-a-live-rule
        name: 'decision record citations resolve'
        entry: cargo run -q -- gate adr-cites-a-live-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-filename-shape
        name: 'decision record filename shape'
        entry: cargo run -q -- gate adr-filename-shape
        language: system
        files: '^_docs/decisions/[^/]*\.md$'
      - id: adr-word-cap
        name: 'decision record word cap'
        entry: cargo run -q -- gate adr-word-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: agents-digest-size
        name: 'agent digest size'
        entry: cargo run -q -- gate agents-digest-size
        language: system
        always_run: true
        pass_filenames: false
      - id: chapter-size-cap
        name: 'chapter and catalog size'
        entry: cargo run -q -- gate chapter-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: comparison-dated-tables
        name: 'comparison tables are dated'
        entry: cargo run -q -- gate comparison-dated-tables
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-escaped-pipes
        name: 'comparison table pipes are escaped'
        entry: cargo run -q -- gate comparison-escaped-pipes
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-legend
        name: 'comparison legend'
        entry: cargo run -q -- gate comparison-legend
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-one-reference-per-cell
        name: 'one reference per comparison cell'
        entry: cargo run -q -- gate comparison-one-reference-per-cell
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-verdict-word
        name: 'comparison verdict word'
        entry: cargo run -q -- gate comparison-verdict-word
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: gate-message-cites-a-rule
        name: 'gate messages cite a rule'
        entry: cargo run -q -- gate gate-message-cites-a-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: instance-manifest
        name: 'instance manifest'
        entry: cargo run -q -- gate instance-manifest
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-bugzilla-report-width
        name: 'Bugzilla report width'
        entry: cargo run -q -- gate ki-bugzilla-report-width
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-checked-date
        name: 'known issue last-check date'
        entry: cargo run -q -- gate ki-checked-date
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-filename-shape
        name: 'known issue filename shape'
        entry: cargo run -q -- gate ki-filename-shape
        language: system
        files: '^(?:_docs/reference/known-issues/KI-[^/]*\.md|tests/fixtures/KI-[^/]*\.md)$'
      - id: ki-filing
        name: 'known issue filing state'
        entry: cargo run -q -- gate ki-filing
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-mechanism-walkthrough
        name: 'known issue mechanism walkthrough'
        entry: cargo run -q -- gate ki-mechanism-walkthrough
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-report-body
        name: 'known issue report body'
        entry: cargo run -q -- gate ki-report-body
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-retire-when
        name: 'known issue retirement condition'
        entry: cargo run -q -- gate ki-retire-when
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-state
        name: 'known issue state'
        entry: cargo run -q -- gate ki-state
        language: system
        always_run: true
        pass_filenames: false
      - id: no-personal-path
        name: 'no personal path'
        entry: cargo run -q -- gate no-personal-path
        language: system
        types: [text]
      - id: no-self-narration
        name: 'documents state the present'
        entry: cargo run -q -- gate no-self-narration
        language: system
        files: '^_docs/(?:specs|decisions|guides|reference|explanation)/(?:.*/)?[^/]*\.md$'
        types: [markdown]
        exclude: '^_docs/decisions/.*$'
      - id: prose-stays-unwrapped
        name: 'prose lines stay unwrapped'
        entry: cargo run -q -- gate prose-stays-unwrapped
        language: system
        files: '^_docs/(?:specs|decisions|guides|reference|explanation)/(?:.*/)?[^/]*\.md$'
        types: [markdown]
        exclude: '^(?:.*/)?CHANGELOG\.md$'
      - id: spec-requirement-parts
        name: 'spec requirement parts'
        entry: cargo run -q -- gate spec-requirement-parts
        language: system
        files: '^_docs/specs/SPEC-[^/]*\.md$'
      - id: spec-rule-id-unique
        name: 'spec rule IDs are unique'
        entry: cargo run -q -- gate spec-rule-id-unique
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-size-cap
        name: 'spec size cap'
        entry: cargo run -q -- gate spec-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-trailing-section
        name: 'spec trailing section'
        entry: cargo run -q -- gate spec-trailing-section
        language: system
        files: '^_docs/specs/SPEC-[^/]*\.md$'
      - id: spec-verify-hooks-exist
        name: 'spec hook references exist'
        entry: cargo run -q -- gate spec-verify-hooks-exist
        language: system
        always_run: true
        pass_filenames: false
      - id: suppression-names-its-case
        name: 'suppressions name a known issue'
        entry: cargo run -q -- gate suppression-names-its-case
        language: system
        always_run: true
        pass_filenames: false
      - id: tracking-registry
        name: 'tracking registry is valid and current'
        entry: cargo run -q -- gate tracking-registry
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links@5.1.3']
# END spec-driven-docs managed
