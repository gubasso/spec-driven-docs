# The host supplies the hook runner prek, and this is the oldest prek the
# configuration accepts
# (https://prek.j178.dev/reference/configuration/#minimum_prek_version).
minimum_prek_version: "0.5.7"
default_install_hook_types: [pre-commit, commit-msg, pre-push, pre-merge-commit]
# The node hook runs on the devshell nodejs. With `system`, prek takes a
# node from outside its own store and downloads none
# (https://prek.j178.dev/reference/language-support/, prek 0.5.7,
# 2026-11-11).
default_language_version:
  node: system
# The commit stage and the push stage together run every check of ci.yml,
# and the push stage carries only the costly checks, so a hook that names no
# stage runs at commit and in the pre-merge-commit hook rk integrate runs, never again
# at push (release:the-local-hooks-run-every-check-of-ci). A remote manifest
# that declares its own stages wins over this default, so those hooks below
# name theirs.
default_stages: [pre-commit, pre-merge-commit]

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at with
# the hook manager this project uses, for example:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push --hook-type pre-merge-commit
# A hook that CI cannot run carries groups: [local-only], with its reason
# above it, and a hook that only CI runs carries stages: [manual] and
# groups: [ci-only]. Mark each hook of this project the same way. CI runs
# each stage with its group filter, through the project's environment, and
# no committed file sets SKIP. A group filter with no --stage also runs the
# manual hooks, so each step names its stage:
#   prek run --all-files --stage pre-commit --no-group local-only
#   prek run --all-files --stage pre-push --no-group local-only
#   prek run --all-files --stage manual --group ci-only
# prek refuses a --group that matches no hook, so leave the third step out
# where no hook carries ci-only.
# rk integrate runs this clone's pre-merge-commit hook through git, on the
# change the integration squashes, and refuses where none is installed.
# Tag pre-merge-commit on every check that must pass before work reaches
# the trunk, and add it to default_stages where this file sets them. Have
# continuous integration invoke the same checks: a check that runs on one
# side of the boundary alone guards one side alone. prek runs each nested
# .pre-commit-config.yaml as a project of its own, so a project that runs
# prek lists a directory of fixtures in a root .prekignore.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # local-only: a CI job on a trunk push checks out the trunk, which
      # this guard refuses.
      - id: no-commit-to-branch
        groups: [local-only]
        args: [--branch, master]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+|rk-release/.+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      # local-only: a CI job checks out the main worktree, which this guard
      # refuses when the checkout is detached.
      - id: rk-worktree-location
        name: rk worktree location
        groups: [local-only]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-force-push-to-trunk
        name: rk no force push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; listed=$(git ls-remote "${PRE_COMMIT_REMOTE_URL:-$PRE_COMMIT_REMOTE_NAME}" refs/heads/master) || { echo "the remote master cannot be read, so a push to it is refused" >&2; exit 1; }; remote=${listed%%[[:space:]]*}; tracked=$(git rev-parse --verify --quiet "refs/remotes/$PRE_COMMIT_REMOTE_NAME/master"); for base in "$remote" "$PRE_COMMIT_FROM_REF" "$tracked"; do case "$base" in "") continue;; *[!0]*) ;; *) continue;; esac; git cat-file -e "$base^{commit}" 2>/dev/null || { echo "refusing a force push to master, because the remote holds $base, which this clone has not fetched; fetch, then rebase onto the remote trunk" >&2; exit 1; }; git merge-base --is-ancestor "$base" "$PRE_COMMIT_TO_REF" 2>/dev/null && continue; echo "refusing a force push to master, because $base is not an ancestor of the pushed tip; rebase onto the remote trunk instead of rewriting it" >&2; exit 1; done'
      - id: rk-no-merge-commit-to-trunk
        name: rk no merge commit to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tip=${PRE_COMMIT_TO_REF:-$PRE_COMMIT_LOCAL_BRANCH}; [ -n "$tip" ] || exit 0; case "$PRE_COMMIT_FROM_REF" in ""|*[!0]*) range=${PRE_COMMIT_FROM_REF:+$PRE_COMMIT_FROM_REF..}$tip;; *) range=$tip;; esac; merges=$(git rev-list --merges "$range") || { echo "the commits pushed to master cannot be listed, so the push is refused" >&2; exit 1; }; [ -z "$merges" ] && exit 0; echo "refusing a push that adds a merge commit to master, whose history stays linear; rebase instead" >&2; git log --oneline --no-walk $merges >&2; exit 1'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|cliff\.toml$|VERSION$)'
# END release-kit
  # The hooks below come from the common, rust, bash, and nix reference sets
  # of exobrain-tech, at the tag of the exobrain-tech entry. hook-revisions
  # holds each `rev` of a set repository to that tag, and `exobrain hooks
  # sync --to <tag>` alone moves them. A comment that starts with `project:`
  # records a field that differs from the set, and its reason.
  #
  # prek runs the built-in hooks in its own binary: no clone, no environment,
  # and no `rev` (https://prek.j178.dev/0.5.7/reference/built-in-hooks/).
  - repo: builtin
    hooks:
      # A generated file keeps the form its generator writes, so no check
      # rewrites it or judges its prose or form (instance/README.md states
      # the rule for every instance). The three fixers have no configuration
      # of their own, so the list lives here: release-plz's CHANGELOG.md,
      # release-kit's rendered SECURITY.md, pr-title.yml, release-plz.yml and
      # manifest, cargo-dist's release.yml, this tool's own instance record,
      # the skill packages that it and release-kit land under .claude/skills
      # and .agents/skills (never a whole skill root, so a skill of this
      # repository's own stays under the checks), the payload record the
      # tree writes, and the cargo and nix lock files. Each other tool
      # excludes them in its own configuration: dprint.json,
      # .markdownlint-cli2.jsonc, _typos.toml,
      # and .editorconfig-checker.json. The reading hooks keep every one.
      # project: the exclude names the generated files of this tree, which
      # the canon test the_generated_files_are_the_ones_the_fixers_skip
      # reads through the &generated anchor.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit, pre-merge-commit]
        exclude: &generated '^(CHANGELOG\.md|SECURITY\.md|\.github/workflows/(pr-title|release-plz|release)\.yml|\.release-kit/manifest\.json|\.spec-driven-docs/manifest\.json|instance/payload-manifest\.json|\.(claude|agents)/skills/(sdd-setup|sdd-write-docs|rk-setup|rk-release)/.*|Cargo\.lock|flake\.lock)$'
      - id: end-of-file-fixer
        stages: [pre-commit, pre-merge-commit]
        exclude: *generated
      # The default `auto` keeps the most frequent ending of a file, so a file
      # that holds only CRLF passes. `--fix=lf` holds every file to LF.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *generated
      # project: --maxkb=16384, the limit this repository set when the canon
      # was established, above the 2 MiB of the set.
      - id: check-added-large-files
        args: [--maxkb=16384]
        stages: [pre-commit, pre-merge-commit]
      - id: check-case-conflict
      # Without the argument the hook passes outside a merge or a rebase, so a
      # marker that a resolved conflict left behind lands unseen.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: destroyed-symlinks
        stages: [pre-commit, pre-merge-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit, pre-merge-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit, pre-merge-commit]
      # prek accepts an unknown tag unless it gets --disallow-unknown-tags. The
      # upstream hook refuses one while it loads the file.
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      - id: check-xml
      # check-json5 parses JSON with comments and trailing commas, so it does
      # not refuse a commented .json configuration such as dprint.json or a
      # .jsonc file. `types` resets the filter to every file, and `types_or`
      # selects json, json5, and jsonc. It is the syntax gate only: dprint
      # owns the layout.
      - id: check-json5
        types: [file]
        types_or: [json, json5, jsonc]
      - id: detect-private-key
  # It checks what no formatter owns: the charset, the line endings, the
  # trailing whitespace, and the indent style. end-of-file-fixer owns the
  # final newline, and each formatter owns the indentation of its files.
  # dprint owns Markdown. .editorconfig-checker.json excludes the generated
  # files.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, -disable-indent-size]
        exclude: '\.md$'
# Hooks only this repository runs sit outside the managed region at the end
# of this file. That region is the render `just hooks` applies, and a cargo
# test holds it there.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint check
        # dprint exits 14 rather than passing when it receives only paths its
        # own config excludes, which is what a commit touching just the
        # generated CHANGELOG.md hands it.
        entry: dprint check --allow-no-files
        language: system
        types_or: [markdown, json]
      # A check, not a fix: a hook that rewrites a file leaves the staged copy
      # behind, so `cargo fmt --check` fails and the author formats.
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml)$'
        pass_filenames: false
      # --all-targets lints the tests too, so a lint in a test fails at commit
      # and not first in CI. The set also names clippy.toml, which this
      # repository keeps as .clippy.toml.
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^(rust-toolchain|clippy)\.toml|^\.clippy\.toml)$'
        pass_filenames: false
      # The instance-manifest gate parses the record in Rust and never reads
      # the published schema, so this holds the record to the schema.
      # owner: devshell (outside-caller) the cargo tests run check-jsonschema from PATH, so the hook runs the same one.
      - id: instance-manifest-schema
        name: instance manifest matches its schema
        entry: check-jsonschema --schemafile instance/manifest.schema.json .spec-driven-docs/manifest.json
        language: system
        files: '^(instance/manifest\.schema\.json|\.spec-driven-docs/manifest\.json)$'
        pass_filenames: false
      # The costly checks run at push, and in the pre-merge-commit hook rk
      # integrate runs, so a push that passed its hooks passes CI.
      # project: each costly check below also names pre-merge-commit, the
      # integration gate of this repository.
      #
      # A test can read any checked-in file, so the suite runs on every push
      # and not only on a change of a Rust file.
      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest
        name: cargo nextest
        entry: cargo nextest run --all-features --no-tests=pass
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push, pre-merge-commit]
      # project: always_run, because a new RustSec advisory fails the check
      # with no change to a file of this tree.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        stages: [pre-push, pre-merge-commit]
        always_run: true
        pass_filenames: false
      # owner: devshell (project-environment) the just recipe builds sdd and installs it into a scratch repository.
      - id: scratch-install
        name: install into a scratch repository and verify it
        entry: just build
        language: system
        stages: [pre-push, pre-merge-commit]
        always_run: true
        pass_filenames: false
      # nix flake check builds only the checks output, so the package is
      # built on its own: without it a green run proves nothing about
      # nix/package.nix.
      # owner: host (host-tool) nix comes from the host, which host-requirements.toml lists.
      - id: nix-build
        name: nix build of the package
        entry: nix build .#default --no-link
        language: system
        stages: [pre-push, pre-merge-commit]
        always_run: true
        pass_filenames: false
      # owner: host (host-tool) nix comes from the host, which host-requirements.toml lists.
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        stages: [pre-push, pre-merge-commit]
        always_run: true
        pass_filenames: false
      # The evaluated half of release:the-binary-builds-for-every-declared-target:
      # nix flake check without --all-systems checks only the system it runs
      # on, so only an evaluation says which systems the flake exposes.
      # owner: devshell (no-hook-language) a script of this repository that evaluates the flake with nix and jq.
      - id: one-system
        name: the flake exposes one system
        entry: ./scripts/check-one-system.sh
        language: system
        stages: [pre-push, pre-merge-commit]
        always_run: true
        pass_filenames: false
      # The flake publishes nixfmt as its `formatter`, and `nix fmt` and the
      # editors run it outside prek. The hook runs the nixfmt of the same
      # nixpkgs, so it formats exactly like them.
      # owner: devshell (outside-caller) nix fmt runs the nixpkgs nixfmt, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
      # statix walks the tree itself, so the hook passes no file names.
      # owner: devshell (no-hook-language) statix has no hook in a language that prek builds.
      - id: statix
        name: statix
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
  # Unused dependencies. Its manifest runs the scan of the whole workspace
  # only when a manifest or the lock file changes.
  # project: pre-merge-commit too, as for the costly checks above.
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.10.1
    hooks:
      - id: cargo-machete
        stages: [pre-push, pre-merge-commit]
  # Its manifest carries `args: [--fail]` and `types: [nix]`.
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix
  # .shellcheckrc would hold the settings. The upstream `types: [shell]`
  # also selects the extensionless scripts of scripts/.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  # shfmt reads .editorconfig only while it gets no parser or printer flag,
  # so the hook keeps the upstream args, [--write], and .editorconfig holds
  # the layout. A fixer never runs at push.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit, pre-merge-commit]
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devshell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
  # md-toc rewrites the list between two `<!--TOC-->` markers.
  # project: `-l, '3'` and `files`, because this repository keeps a TOC
  # only in its specs, as the set comment allows.
  - repo: https://github.com/frnmst/md-toc
    rev: 9.1.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github, -l, '3']
        files: '^_docs/specs/SPEC-.*\.md$'
  # Report only: fix a real typo by hand, and allowlist a false positive in
  # _typos.toml. --force-exclude keeps the excludes of _typos.toml for the
  # files that prek passes.
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit, pre-merge-commit]
  # Two layers. ripsecrets scans what each commit adds. gitleaks scans the
  # whole history before a push, so it passes no file names.
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # project: pre-merge-commit too, as for the costly checks above.
      - id: gitleaks
        entry: gitleaks git --redact --verbose --no-banner
        pass_filenames: false
        stages: [pre-push, pre-merge-commit]
  # A network check, so it runs at push. lychee.toml holds every setting. The
  # devshell supplies lychee, and the rev pins only the hook definition.
  # The group `local-only` keeps it out of CI, because an outside site
  # answers a CI runner with a block or a timeout that it does not give a
  # developer host.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push]
        groups: [local-only]
        types: [markdown]
        args: [--no-progress]
        # project: CHANGELOG.md is release-plz output, like the dprint and
        # prose-gate exemptions: it links every version to a compare range
        # whose endpoints it assumes are tags, and 0.2.0 was published by
        # hand and never tagged. The fixtures hold dead links on purpose.
        exclude: '^(tests/fixtures/|CHANGELOG\.md$)'
  # committed.toml holds the rules.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.12
    hooks:
      - id: committed
        stages: [commit-msg]
  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store, and a flake holds no hook runner.
  # host-requirements holds host-requirements.toml to its schema, and
  # hook-revisions holds the revisions of the named sets to the tag of this
  # entry. exobrain-tech publishes the hooks, and the host supplies the
  # exobrain CLI that they call.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.2.0
    hooks:
      - id: no-path-flake-reference
      - id: no-hook-runner-in-flake
      - id: host-requirements
      - id: hook-revisions
        args: [--set, common, --set, rust, --set, bash, --set, nix]
  # It refuses an exclude pattern that matches no file.
  - repo: meta
    hooks:
      - id: check-useless-excludes
# BEGIN spec-driven-docs managed
  - repo: local
    hooks:
      - id: spec-driven-docs-verify
        name: verify spec-driven docs instance
        entry: sdd verify
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-cites-a-live-rule
        name: 'decision record citations resolve'
        entry: sdd gate adr-cites-a-live-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-filename-shape
        name: 'decision record filename shape'
        entry: sdd gate adr-filename-shape
        language: system
        files: '^_docs/decisions/[^/]*\.md$'
      - id: adr-word-cap
        name: 'decision record word cap'
        entry: sdd gate adr-word-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: agents-digest-size
        name: 'agent digest size'
        entry: sdd gate agents-digest-size
        language: system
        always_run: true
        pass_filenames: false
      - id: chapter-size-cap
        name: 'chapter and catalog size'
        entry: sdd gate chapter-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: comparison-dated-tables
        name: 'comparison tables are dated'
        entry: sdd gate comparison-dated-tables
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-escaped-pipes
        name: 'comparison table pipes are escaped'
        entry: sdd gate comparison-escaped-pipes
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-legend
        name: 'comparison legend'
        entry: sdd gate comparison-legend
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-one-reference-per-cell
        name: 'one reference per comparison cell'
        entry: sdd gate comparison-one-reference-per-cell
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-verdict-word
        name: 'comparison verdict word'
        entry: sdd gate comparison-verdict-word
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: gate-message-cites-a-rule
        name: 'gate messages cite a rule'
        entry: sdd gate gate-message-cites-a-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: instance-manifest
        name: 'instance manifest'
        entry: sdd gate instance-manifest
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-bugzilla-report-width
        name: 'Bugzilla report width'
        entry: sdd gate ki-bugzilla-report-width
        language: system
        always_run: true
        pass_filenames: false
