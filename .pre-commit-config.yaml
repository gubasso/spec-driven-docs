default_install_hook_types: [pre-commit, commit-msg, pre-push]

# The vendored dependency surface is owned upstream and refreshed only by
# scripts/vendor-simpleenglish.sh. No repo-wide formatter or linter may touch
# it, or it drifts from its recorded digests.
exclude: '^third-party/'

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at:
# pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# A CI sweep commits nothing, so a job running pre-commit against a trunk
# checkout sets SKIP=no-commit-to-branch,rk-worktree-location in its environment.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope, --scopes, 'release,gates,skills,skill-shared,distribution,specs,docs,guides,method,comparison-docs,templates,reference,instance,deps,ci,lint']
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      - id: rk-worktree-location
        name: rk worktree location
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout takes no branch commit, as the forge trunk takes no direct push; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-push-to-trunk
        name: rk no push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/master ] || { echo "the trunk takes no direct push; it is written through squash-merged pull requests alone" >&2; exit 1; }'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|release-please-config\.json$|cliff\.toml$|\.release-please-manifest\.json$|VERSION$)'
# END release-kit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: destroyed-symlinks
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline]
        exclude: '\.md$'
# BEGIN spec-driven-docs managed
  - repo: local
    hooks:
      - id: dprint
        name: dprint check
        # dprint exits 14 rather than passing when it receives only paths its
        # own config excludes, which is what a commit touching just the
        # generated CHANGELOG.md hands it.
        entry: dprint check --allow-no-files
        language: system
        types_or: [markdown, json]
      - id: shfmt
        name: shfmt check
        entry: shfmt -d -i 2 -ci
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: '\.(sh|bash)$'
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo nextest
        entry: cargo nextest run
        language: system
        files: '^(src/|tests/|build\.rs$|Cargo\.(toml|lock)$|_docs/specs/|templates/|\.markdownlint/|instance/|method/|skills/|migrations/|LICENSE|\.pre-commit-config\.yaml$)'
        pass_filenames: false
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github, -l, '3']
        files: '^_docs/specs/SPEC-.*\.md$'
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
      - id: markdownlint-cli2
        alias: md-relative-links
        name: markdownlint relative links
        additional_dependencies: ['markdownlint-rule-relative-links']
        args: ['--config', '.markdownlint/relative-links.markdownlint-cli2.jsonc']
        exclude: '^_docs/decisions/'
      - id: markdownlint-cli2
        alias: md-spec
        name: markdownlint spec heading shape
        files: '^_docs/specs/SPEC-[a-z0-9-]+\.md$'
        args: ['--config', '.markdownlint/spec.markdownlint-cli2.jsonc']
      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint decision heading shape
        files: '^_docs/decisions/ADR-[a-z-]+\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']
  - repo: local
    hooks:
      - id: spec-driven-docs-verify
        name: verify spec-driven docs instance
        entry: cargo run -q -- verify
        language: system
        always_run: true
        pass_filenames: false
      - id: no-personal-path
        name: no personal path
        entry: cargo run -q -- gate no-personal-path
        language: system
        types: [text]
      - id: no-self-narration
        name: documents state the present
        entry: cargo run -q -- gate no-self-narration
        language: system
        types: [markdown]
        exclude: '^_docs/decisions/'
      - id: prose-stays-unwrapped
        name: prose lines stay unwrapped
        entry: cargo run -q -- gate prose-stays-unwrapped
        language: system
        types: [markdown]
        exclude: '(?:^|/)CHANGELOG\.md$'
      - id: adr-cites-a-live-rule
        name: decision record citations resolve
        entry: cargo run -q -- gate adr-cites-a-live-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-filename-shape
        name: decision record filename shape
        entry: cargo run -q -- gate adr-filename-shape
        language: system
        files: '^_docs/decisions/.*\.md$'
      - id: adr-word-cap
        name: decision record word cap
        entry: cargo run -q -- gate adr-word-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: agents-digest-size
        name: agent digest size
        entry: cargo run -q -- gate agents-digest-size
        language: system
        always_run: true
        pass_filenames: false
      - id: chapter-size-cap
        name: chapter and catalog size
        entry: cargo run -q -- gate chapter-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-requirement-parts
        name: spec requirement parts
        entry: cargo run -q -- gate spec-requirement-parts
        language: system
        files: '^_docs/specs/SPEC-.*\.md$'
      - id: spec-rule-id-unique
        name: spec rule IDs are unique
        entry: cargo run -q -- gate spec-rule-id-unique
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-size-cap
        name: spec size cap
        entry: cargo run -q -- gate spec-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-verify-hooks-exist
        name: spec hook references exist
        entry: cargo run -q -- gate spec-verify-hooks-exist
        language: system
        always_run: true
        pass_filenames: false
      - id: suppression-names-its-case
        name: suppressions name a known issue
        entry: cargo run -q -- gate suppression-names-its-case
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: ki-filename-shape
        name: known issue filename shape
        entry: cargo run -q -- gate ki-filename-shape
        language: system
        files: '^(_?docs/reference/known-issues|tests/fixtures)/KI-.*\.md$'
      - id: ki-filing
        name: known issue filing state
        entry: cargo run -q -- gate ki-filing
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: ki-mechanism-walkthrough
        name: known issue mechanism walkthrough
        entry: cargo run -q -- gate ki-mechanism-walkthrough
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: ki-report-body
        name: known issue report body
        entry: cargo run -q -- gate ki-report-body
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: ki-retire-when
        name: known issue retirement condition
        entry: cargo run -q -- gate ki-retire-when
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: ki-state
        name: known issue state
        entry: cargo run -q -- gate ki-state
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: ki-bugzilla-report-width
        name: Bugzilla report width
        entry: cargo run -q -- gate ki-bugzilla-report-width
        language: system
        always_run: true
        pass_filenames: false
        args: ['tests/fixtures']
      - id: comparison-dated-tables
        name: comparison tables are dated
        entry: cargo run -q -- gate comparison-dated-tables
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-escaped-pipes
        name: comparison table pipes are escaped
        entry: cargo run -q -- gate comparison-escaped-pipes
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-legend
        name: comparison legend
        entry: cargo run -q -- gate comparison-legend
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-one-reference-per-cell
        name: one reference per comparison cell
        entry: cargo run -q -- gate comparison-one-reference-per-cell
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: comparison-verdict-word
        name: comparison verdict word
        entry: cargo run -q -- gate comparison-verdict-word
        language: system
        files: '^templates/TEMPLATE-comparison\.md$'
      - id: instance-manifest
        name: instance manifest
        entry: cargo run -q -- gate instance-manifest
        language: system
        always_run: true
        pass_filenames: false
      - id: gate-message-cites-a-rule
        name: gate messages cite a rule
        entry: cargo run -q -- gate gate-message-cites-a-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: simple-english
        name: prose follows SimpleEnglish
        entry: cargo run -q -- gate simple-english
        language: system
        types: [markdown]
        # The delivered gate excludes decisions, generated output, and the
        # vendored surface. This canon adds a shrinking adoption exemption:
        # the files below predate the convention and are converted in
        # batches. Remove a path here once it passes; the gate then enforces
        # it. This exemption is canon-local and ships to no instance.
        exclude: '(^_docs/decisions/|^docs/decisions/|(?:^|/)CHANGELOG\.md$|^third-party/|^\.spec-driven-docs/|(?:^|/)tests/fixtures/|^(?:AGENTS\.md|README\.md|_docs/guides/release\-setup\.md|_docs/guides/release\.md|_docs/reference/TEMPLATE\-agents\-digest\.md|_docs/specs/SPEC\-comparison\-docs\.md|_docs/specs/SPEC\-decision\-records\.md|_docs/specs/SPEC\-distribution\.md|_docs/specs/SPEC\-docs\-format\.md|_docs/specs/SPEC\-docs\-foundations\.md|_docs/specs/SPEC\-docs\-specs\.md|_docs/specs/SPEC\-guides\.md|_docs/specs/SPEC\-instance\.md|_docs/specs/SPEC\-known\-issues\.md|_docs/specs/SPEC\-release\.md|_docs/specs/SPEC\-spec\-to\-code\.md|comparison\-docs/00\-model\.md|comparison\-docs/01\-table\-shape\.md|comparison\-docs/02\-verdicts\.md|comparison\-docs/03\-references\.md|comparison\-docs/04\-scenarios\.md|comparison\-docs/05\-freshness\.md|comparison\-docs/06\-gates\.md|comparison\-docs/99\-checklist\.md|comparison\-docs/AGENTS\.md|comparison\-docs/README\.md|comparison\-docs/SOURCES\.md|instance/README\.md|method/00\-model\.md|method/01\-placement\.md|method/02\-specs\.md|method/03\-rules\.md|method/04\-decisions\.md|method/05\-agent\-context\.md|method/06\-format\.md|method/07\-lifecycle\.md|method/08\-gates\.md|method/09\-spec\-to\-code\.md|method/10\-procedures\.md|method/11\-operational\.md|method/12\-migration\.md|method/99\-checklist\.md|method/glossary\.md|reference/prior\-art/spec\-driven\-development\.md|reference/tracker\-markup/bugzilla\-comment\-syntax\.md|reference/tracker\-markup/jira\-wiki\-markup\.md|skill\-shared/plan\-gate\.md|skill\-shared/pre\-flight\-gate\.md|skills/sdd\-migrate/SKILL\.md|skills/sdd\-setup/SKILL\.md|skills/sdd\-write\-docs/SKILL\.md|templates/TEMPLATE\-adr\.md|templates/TEMPLATE\-agents\-digest\.md|templates/TEMPLATE\-comparison\.md|templates/TEMPLATE\-docs\-rules\.md)$)'
      - id: tracking-registry
        name: tracking registry is valid and current
        entry: cargo run -q -- gate tracking-registry
        language: system
        always_run: true
        pass_filenames: false
# END spec-driven-docs managed
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        language: system
        args: [--force-exclude]
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        stages: [pre-push]
        types: [markdown]
        # CHANGELOG.md is release-plz output, like the dprint and prose-gate
        # exemptions: it links every version to a compare range whose endpoints
        # it assumes are tags, and 0.2.0 was published by hand and never tagged.
        exclude: '^(tests/fixtures/|CHANGELOG\.md$)'
        # The first argument pins the binary version the wrapper installs,
        # because under a git hook GIT_DIR leaks into the wrapper's tag
        # lookup and its version detection resolves this repository instead
        # of its own checkout. Keep the value equal to the rev above.
        args: ['LYCHEE_VERSION=0.24.2', --no-progress]
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        language: system
        stages: [commit-msg]
