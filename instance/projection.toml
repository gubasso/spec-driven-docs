# What this release lands, declared as data.
#
# The binary reads this file from the payload it carries, so what a
# release lands is what that release declares. It is embedded and never
# landed into a target: it describes the projection rather than being
# part of it.

# Where each profile keeps the documents the gates read.
[[profiles]]
id = "codebase"
docs_root = "docs"

[[profiles]]
id = "knowledge-base"
docs_root = "_docs"

# Byte projections the canon keeps owning. No skill appears here: the
# candidate derives every skill entry from the payload, one per package
# file under each skill root, so the skills follow the binary that lands
# them. A destination carrying "{docs_root}" is resolved per profile.

# The documentation root's lint configuration. The markdown linter
# discovers it beside the documents it judges and merges it over the
# project's own configuration.
[[managed]]
source = "instance/payload/_docs/.markdownlint-cli2.jsonc"
destination = "{docs_root}/.markdownlint-cli2.jsonc"

# Seeds the instance owns from the moment they land. A destination
# carrying "{docs_root}" is resolved per profile.

[[adopted]]
source = "instance/seeds/config.yaml"
destination = ".spec-driven-docs/config.yaml"

# The repository's lint configuration, which loads the relative-links
# rule. It yields where the target root already holds a markdownlint
# configuration of either family: that configuration is the project's,
# and a second file beside it would change what the linter reads.
[[adopted]]
source = "instance/seeds/markdownlint-cli2.jsonc"
destination = ".markdownlint-cli2.jsonc"
yields_to = "markdownlint-configuration"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-budget-debt.md"
destination = "{docs_root}/specs/SPEC-budget-debt.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-writing-policy.md"
destination = "{docs_root}/specs/SPEC-writing-policy.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-decision-records.md"
destination = "{docs_root}/specs/SPEC-decision-records.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-instance.md"
destination = "{docs_root}/specs/SPEC-instance.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-docs-format.md"
destination = "{docs_root}/specs/SPEC-docs-format.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-docs-foundations.md"
destination = "{docs_root}/specs/SPEC-docs-foundations.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-docs-specs.md"
destination = "{docs_root}/specs/SPEC-docs-specs.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-comparison-docs.md"
destination = "{docs_root}/specs/SPEC-comparison-docs.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-known-issues.md"
destination = "{docs_root}/specs/SPEC-known-issues.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-spec-to-code.md"
destination = "{docs_root}/specs/SPEC-spec-to-code.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-guides.md"
destination = "{docs_root}/specs/SPEC-guides.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-writing-style.md"
destination = "{docs_root}/specs/SPEC-writing-style.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-tracking.md"
destination = "{docs_root}/specs/SPEC-tracking.md"

[[adopted]]
source = "instance/payload/_docs/specs/SPEC-tracking/tracking.schema.json"
destination = "{docs_root}/specs/SPEC-tracking/tracking.schema.json"

[[adopted]]
source = "templates/TEMPLATE-tracking.yaml"
destination = "{docs_root}/reference/tracking.yaml"

[[adopted]]
source = "templates/TEMPLATE-spec.md"
destination = "{docs_root}/specs/TEMPLATE-spec.md"

[[adopted]]
source = "templates/TEMPLATE-adr.md"
destination = "{docs_root}/decisions/TEMPLATE-adr.md"

[[adopted]]
source = "templates/TEMPLATE-agents-digest.md"
destination = "{docs_root}/reference/TEMPLATE-agents-digest.md"

[[adopted]]
source = "templates/TEMPLATE-guide.md"
destination = "{docs_root}/guides/TEMPLATE-guide.md"

[[adopted]]
source = "templates/TEMPLATE-known-issue.md"
destination = "{docs_root}/reference/TEMPLATE-known-issue.md"

# One sentinel per feature a project can declare against its own
# adopted specifications. Presence of the rule ID is what says the
# instance's specs authorize the declaration.

[[sentinels]]
rule = "budget-debt:a-recorded-dimension-only-shrinks"
source = "instance/payload/_docs/specs/SPEC-budget-debt.md"
destination = "{docs_root}/specs/SPEC-budget-debt.md"
declares = ".spec-driven-docs/debt.yaml records budget debt"

[[sentinels]]
rule = "writing-policy:the-project-selects-one-source"
source = "instance/payload/_docs/specs/SPEC-writing-policy.md"
destination = "{docs_root}/specs/SPEC-writing-policy.md"
declares = ".spec-driven-docs/config.yaml selects a writing style other than builtin"
