name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # The job name is the status-check context branch protection requires, and
  # the check the release gate waits on. It runs unless cancelled, so a job
  # added later as a need cannot turn a failure into a skip the forge reads
  # as success.
  test:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      # Every check of this job is a hook, so a push that passed its hooks
      # passes here (release:the-local-hooks-run-every-check-of-ci). The
      # commit stage runs first, then the costly checks of the push stage.
      # A CI checkout commits nothing, so the two guards of where a local
      # commit happens are skipped: no-commit-to-branch refuses the trunk,
      # and rk-worktree-location refuses a main checkout.
      - run: nix develop --command pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch,rk-worktree-location
      - run: nix develop --command pre-commit run --all-files --hook-stage pre-push
        env:
          SKIP: no-commit-to-branch,rk-worktree-location
