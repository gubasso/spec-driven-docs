name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # The job name is the status-check context branch protection requires, and
  # the check the release gate waits on. It runs unless cancelled, so a job
  # added later as a need cannot turn a failure into a skip the forge reads
  # as success.
  test:
    needs: [dist-plan, dist-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The job runs after a failed need, so it fails here unless every job
      # it needs passed.
      - name: every job the gate needs passed
        if: ${{ needs.dist-plan.result != 'success' || needs.dist-build.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      # The hook runner is a host tool, so the job installs it outside the
      # devshell, at the version the hosts run, and `nix develop` keeps it on
      # PATH (release:the-devshell-supplies-every-project-tool). The action
      # is pinned by commit SHA (https://prek.j178.dev/ci/).
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
      # Every check of this job is a hook, so a push that passed its hooks
      # passes here (release:the-local-hooks-run-every-check-of-ci). The
      # commit stage runs first, then the costly checks of the push stage.
      # A CI checkout commits nothing, so the two guards of where a local
      # commit happens are skipped: no-commit-to-branch refuses the trunk,
      # and rk-worktree-location refuses a main checkout.
      - run: nix develop --command prek run --all-files
        env:
          SKIP: no-commit-to-branch,rk-worktree-location
      # lychee-system is local-only: an external site answers a CI runner
      # with a block or a timeout that it does not give a developer host.
      - run: nix develop --command prek run --all-files --hook-stage pre-push
        env:
          SKIP: no-commit-to-branch,rk-worktree-location,lychee-system

  # rk's rust binding serves the two jobs below, and the gate needs them so
  # that every release target builds before a merge. Each dist step runs in
  # the devshell, which pins dist and the toolchain
  # (release:the-devshell-supplies-every-project-tool). Both jobs are the
  # checks that only CI runs (release:the-local-hooks-run-every-check-of-ci).
  dist-plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: dist runs at the configured pin
        run: |
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version"; exit 1; }
          dist --version | grep -Fq "$pin"
      - name: the committed workflow is what the pin produces
        run: |
          git ls-files --error-unmatch -- .github/workflows/release.yml > /dev/null
          dist generate
          git diff --exit-code -- .github/workflows/release.yml
      - name: the configuration produces a viable release
        id: plan
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "plan=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

  dist-build:
    needs: dist-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dist-plan.outputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: build the matrix target
        env:
          DIST_ARGS: ${{ matrix.dist_args }}
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          # shellcheck disable=SC2086
          dist build $DIST_ARGS
