name: ci

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix develop --command just check

  # A tag is what a consumer's `rev:` resolves against, so the name is checked
  # against VERSION at the commit it points at, not at the commit that authored
  # it. `fetch-depth: 0` is what makes the tag visible to the checkout.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix develop --command scripts/release.sh --verify "${{ github.ref_name }}"
