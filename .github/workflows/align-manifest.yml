# The release pull request bumps Cargo.toml, and the canon manifest must
# carry the same version (release:versions-are-semantic-and-aligned), so it
# is regenerated onto the bot's branch here. When a later master push makes
# release-plz rewrite that branch, the push retriggers this workflow and the
# alignment re-applies; the alignment commit itself produces no further diff,
# so the retrigger it causes ends quietly. This file is the repository's own,
# beside the release-kit payload: release-plz.yml stays byte-identical to the
# landed snippet, and this carries the one repo-specific job.
name: align-manifest

permissions: {}

on:
  push:
    branches: ['release-plz-*']

jobs:
  align:
    if: github.repository_owner == 'gubasso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The bot's branch rewrite and this job's own alignment push arrive close
    # together; two concurrent runs race the push and the loser goes red on a
    # rejected non-fast-forward. Serializing per ref lets the second run see
    # the first one's commit and exit on an empty diff instead.
    concurrency:
      group: align-manifest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: regenerate the canon manifest on the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eu
          cargo run -q -- self-manifest
          if ! git diff --quiet; then
            uid="$(gh api "/users/${APP_SLUG}[bot]" -q .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
            git commit -am 'chore(release): Align the canon manifest with the release version'
            git push
          fi
