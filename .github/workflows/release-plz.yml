# The release automation and the crates.io trusted publisher. This filename
# is registered at crates.io; cargo-dist's release.yml builds binaries and
# must never be registered there.
#
# The two halves run on different branches. On develop, release-plz opens the
# version-bump pull request, the manifest is realigned onto its branch, and
# the release gate pull request is opened once a version is pending; merging
# any of that publishes nothing. On master, reached only through that gate,
# release-plz tags the merge commit and publishes. The publish half runs free
# of any concurrency group — cancelling it could skip a release — while the
# pull-request half serializes per ref so racing pushes cannot fight over the
# release pull request.
name: release-plz

permissions: {}

on:
  push:
    branches: [develop, master]

jobs:
  # master is reached only through a reviewed pull request carrying a passing
  # test check, so this is the gated half (ADR-cut-the-release-from-master).
  # The app token is what makes the tag trigger release.yml; a tag pushed with
  # GITHUB_TOKEN starts no further workflow.
  release-plz-release:
    if: github.repository_owner == 'gubasso' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    if: github.repository_owner == 'gubasso' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      prs_created: ${{ steps.release-pr.outputs.prs_created }}
      pr: ${{ steps.release-pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # The release pull request bumps Cargo.toml, and the canon manifest must
  # carry the same version, so it is regenerated onto the pull request branch
  # here. When a later develop push makes release-plz rewrite its branch,
  # this job re-applies.
  align-manifest:
    needs: release-plz-pr
    if: github.repository_owner == 'gubasso' && needs.release-plz-pr.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-plz-pr.outputs.pr).head_branch }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: regenerate the canon manifest on the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eu
          cargo run -q -- self-manifest
          if ! git diff --quiet; then
            uid="$(gh api "/users/${APP_SLUG}[bot]" -q .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
            git commit -am 'chore(release): Align the canon manifest with the release version'
            git push
          fi

  # The gate itself. Once the release pull request has merged, develop carries
  # a version no tag names yet, so this opens the develop-to-master pull
  # request that master-protection gates. Both guards matter: a missing tag is
  # what marks the version unreleased, and the commit-count check keeps the
  # back-merge push from racing ahead of the tag and opening an empty request.
  open-release-gate:
    if: github.repository_owner == 'gubasso' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: open the release gate pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::could not read the version from Cargo.toml."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already tagged; no release is pending."
            exit 0
          fi
          ahead="$(gh api "repos/$GH_REPO/compare/master...develop" -q '.ahead_by')"
          if [ "$ahead" -eq 0 ]; then
            echo "develop is not ahead of master; nothing to gate."
            exit 0
          fi
          open="$(gh pr list --base master --head develop --state open --json number -q 'length')"
          if [ "$open" -gt 0 ]; then
            echo "the release gate pull request is already open."
            exit 0
          fi
          gh pr create --base master --head develop \
            --title "release v$version" \
            --body "Gates the release of v$version. Merging tags the commit and publishes; merge it as a merge commit."
