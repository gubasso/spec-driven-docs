# The release automation and the crates.io trusted publisher. This filename
# is registered at crates.io; cargo-dist's release.yml builds binaries and
# must never be registered there.
#
# Two release-plz jobs, as upstream ships its own releases: the publish half
# runs free of any concurrency group — cancelling it could skip a release —
# while the PR half serializes per ref so racing pushes cannot fight over
# the release pull request.
name: release-plz

permissions: {}

on:
  push:
    branches: [develop]

jobs:
  release-plz-release:
    if: github.repository_owner == 'gubasso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    if: github.repository_owner == 'gubasso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      prs_created: ${{ steps.release-pr.outputs.prs_created }}
      pr: ${{ steps.release-pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # The release PR bumps Cargo.toml, and the canon manifest must carry the
  # same version, so it is regenerated onto the PR branch here. When a later
  # develop push makes release-plz rewrite its branch, this job re-applies.
  align-manifest:
    needs: release-plz-pr
    if: github.repository_owner == 'gubasso' && needs.release-plz-pr.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-plz-pr.outputs.pr).head_branch }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: regenerate the canon manifest on the release branch
        run: |
          set -eu
          cargo run -q -- self-manifest
          if ! git diff --quiet; then
            git config user.name 'release-plz-align'
            git config user.email 'release-plz-align@users.noreply.github.com'
            git commit -am 'chore(release): Align the canon manifest with the release version'
            git push
          fi

  # master mirrors releases. The tag release-plz pushes does not retrigger
  # other workflows, so the promotion runs inline, guarded so master can
  # only ever fast-forward onto a tag that develop reaches.
  promote:
    needs: release-plz-release
    if: github.repository_owner == 'gubasso' && needs.release-plz-release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: fast-forward master to the release tag
        env:
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          set -eu
          tag="$(printf '%s' "$RELEASES" | jq -r '.[0].tag')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::could not determine the release tag from release-plz output."
            exit 1
          fi
          git fetch origin "refs/tags/$tag" 'refs/heads/*:refs/remotes/origin/*'
          tag_sha="$(git rev-parse "$tag^{commit}")"
          if ! git merge-base --is-ancestor "$tag_sha" origin/develop; then
            echo "::error::tag $tag is not on develop; refusing to promote master."
            exit 1
          fi
          git config user.name 'release-plz-promote'
          git config user.email 'release-plz-promote@users.noreply.github.com'
          if git rev-parse -q --verify origin/master >/dev/null; then
            git checkout -B master origin/master
            git merge --ff-only "$tag_sha"
          else
            git checkout -B master "$tag_sha"
          fi
          git push origin master
