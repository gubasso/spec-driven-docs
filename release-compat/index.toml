# Which published releases this engine can read, and how.
#
# Every release before the projection declaration has to be described
# from outside, because an immutable crate cannot acquire a fact it was
# published without. This file is that description, and it is finite: it
# closes the day schema 1 ships, and every release after that one
# describes itself.
#
# Read from the registry index and the published archives on 2026-09-12.
# A release is eligible when its archive carries every payload root the
# projection needs. One below the floor is unavailable as a destination
# rather than guessed at.

